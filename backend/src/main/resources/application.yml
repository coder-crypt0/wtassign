server:
  port: ${PORT:8087}
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
spring:
  application:
    name: crease
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/crease;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
crease:
  simulation:
    enabled: ${SIMULATION_ENABLED:true}
    interval-ms: ${SIMULATION_INTERVAL_MS:8000}
logging:
  level:
    org.hibernate.orm.jdbc.warn: ERROR
